<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
<title id="title">A little companion for your side quests</title><desc id="desc">A blinking cream cat with a swaying tail, beside the words: Keep a little curiosity. One tiny discovery at a time.</desc>
<style>
.eye{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}.tail{animation:tail 3s ease-in-out infinite;transform-origin:160px 149px}.spark{animation:glow 3s ease-in-out infinite}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes tail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.eye,.tail,.spark{animation:none}}
</style>
<rect x="1" y="1" width="638" height="198" rx="20" fill="#fff5f9" stroke="#efc9d9"/>
<circle cx="115" cy="102" r="72" fill="#fbe3ed"/>
<path class="tail" d="M155 148C214 151 202 106 184 121" fill="none" stroke="#b97991" stroke-width="13" stroke-linecap="round"/>
<ellipse cx="116" cy="140" rx="46" ry="25" fill="#fff8ed" stroke="#b97991" stroke-width="2.5"/>
<path d="M77 83L77 48L101 66Q117 59 133 66L156 48L158 85C171 129 64 131 77 83Z" fill="#fff8ed" stroke="#b97991" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M83 72V59L94 69M140 69L150 59V73" fill="#f3b3ca"/>
<g fill="#6e465c"><ellipse class="eye" cx="101" cy="92" rx="3" ry="4"/><ellipse class="eye" cx="135" cy="92" rx="3" ry="4"/></g>
<g fill="#f3b3ca" opacity=".7"><ellipse cx="90" cy="102" rx="7" ry="4"/><ellipse cx="146" cy="102" rx="7" ry="4"/></g>
<path d="M115 99L119 99L117 102M117 102Q111 109 108 103M117 102Q122 109 126 103" fill="none" stroke="#986078" stroke-width="1.8" stroke-linecap="round"/>
<path class="spark" d="M191 49l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#d88aa9"/>
<text x="242" y="65" font-family="Verdana,sans-serif" font-size="10" letter-spacing="3" fill="#a04b72">SIDE QUEST COMPANION</text>
<text x="242" y="100" font-family="Verdana,sans-serif" font-size="21" fill="#80445e">Keep a little curiosity.</text>
<text x="242" y="128" font-family="Verdana,sans-serif" font-size="13" fill="#986078">One tiny discovery at a time.</text>
<text x="242" y="158" font-family="Verdana,sans-serif" font-size="11" fill="#a04b72">READ · BUILD · PLAY · REPEAT</text>
</svg>

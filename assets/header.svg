<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
<title id="title">OrbisLumen’s little corner</title>
<desc id="desc">A rose-pink welcome with drifting petals and twinkling stars.</desc>
<defs>
  <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#a94f78"/><stop offset=".55" stop-color="#d47c9d"/><stop offset="1" stop-color="#efacc2"/></linearGradient>
  <path id="petal" d="M0 0C-10-14 9-23 12-23C17-9 10-1 0 0Z"/>
</defs>
<style>
.petal{animation:drift 12s linear infinite;fill:#ffe3ee;opacity:.65;transform-box:fill-box;transform-origin:center}
.p2{animation-delay:-4s;animation-duration:15s}.p3{animation-delay:-8s;animation-duration:13s}.p4{animation-delay:-2s;animation-duration:17s}
.star{animation:twinkle 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.s2{animation-delay:-2s}
@keyframes drift{0%{transform:translate(-18px,-35px) rotate(-20deg);opacity:0}15%,75%{opacity:.65}100%{transform:translate(70px,140px) rotate(160deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.petal,.star{animation:none}}
</style>
<path fill="url(#rose)" d="M0 0H960V131C795 181 670 107 480 142S160 170 0 131Z"/>
<path fill="none" stroke="#ffe2eb" stroke-opacity=".35" d="M0 119C175 156 320 119 480 130S790 165 960 119"/>
<g class="petal"><use href="#petal" x="86" y="30"/></g><g class="petal p2"><use href="#petal" x="215" y="24"/></g><g class="petal p3"><use href="#petal" x="751" y="20"/></g><g class="petal p4"><use href="#petal" x="866" y="30"/></g>
<g fill="#fff0f6"><path class="star" d="M145 65l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/><path class="star s2" d="M810 62l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/></g>
<text x="480" y="61" text-anchor="middle" font-family="Verdana,sans-serif" font-size="12" letter-spacing="5" fill="#fff0f6">A LITTLE SPACE TO BLOOM</text>
<text x="480" y="98" text-anchor="middle" font-family="Verdana,sans-serif" font-size="29" letter-spacing="2" fill="#fff">OrbisLumen’s little corner</text>
<text x="480" y="123" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" letter-spacing="3" fill="#fff0f6">CS · MACHINE LEARNING · ACGN</text>
</svg>
